name: MailPulse Workflow


on:
  push:
    branches:
      - workflow


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Fill database
        run: |
          python manage.py makemigrations
          python manage.py migrate
          python manage.py create_managers_group
          python manage.py fill_fake_data

      - name: Check flake8
        run: |
          flake8 .

      - name: Run tests
        run: |
          pytest -v

  notify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Отправка уведомления в Телеграм
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_USER_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Успешная проверка проекта https://github.com/PAST666/MailPulse
