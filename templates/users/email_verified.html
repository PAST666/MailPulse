{% extends 'base.html' %}

{% block title %}
    {% if error %}
        Ошибка подтверждения
    {% else %}
        Аккаунт подтверждён
    {% endif %}
{% endblock %}

{% block content %}
    {% if error %}
        <div class="text-center" style="width: 80%; margin: 0 auto">
            <div class="alert alert-danger" role="alert" style="width: 60%; margin: 0 auto">
                    {{ error }}
            </div>
        </div>
    {% endif %}
{% endblock%}
